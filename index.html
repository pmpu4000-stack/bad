<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>家長登入</title>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: "Microsoft JhengHei", Arial, sans-serif; background: #f9f9f9; padding: 20px; }
    h2, h3 { color: #333; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background: #4CAF50; color: white; }
    tr:nth-child(even) { background: #f2f2f2; }
    .high-score { color: green; font-weight: bold; }
    .low-score { color: red; font-weight: bold; }
    canvas { margin-top: 30px; }
    #summary div { flex:1; background:#fff; padding:20px; text-align:center; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
    #summary { display:flex; gap:20px; margin-top:20px; }
  </style>
</head>
<body>
  <h2>家長登入</h2>
  <input id="username" placeholder="家長帳號">
  <input id="password" type="password" placeholder="家長密碼">
  <button onclick="login()">登入</button>

  <div id="summary"></div>
  <div id="result"></div>

  <!-- 圖表區 -->
  <canvas id="accuracyChart"></canvas>
  <canvas id="wordsChart"></canvas>
  <canvas id="statusChart"></canvas>
  <canvas id="heatmapChart"></canvas>
  <canvas id="streakChart"></canvas>
  <canvas id="levelsChart"></canvas>

  <script>
    function sum(arr){ return arr.reduce((a,b)=>a+(Number(b)||0),0); }

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('你的Apps Script網址', {
        method: 'POST',
        body: JSON.stringify({username, password})
      });
      const result = await res.json();
      if (result.status === 'success') {
        // 總結區塊
        const latestRecord = result.records[result.records.length - 1];
        const latestScore = latestRecord[2];
        const latestAccuracy = latestRecord[7];
        const totalWords = result.records.slice(1).reduce((sum, r) => sum + (Number(r[14]) || 0), 0);
        document.getElementById('summary').innerHTML = `
          <div><h3 style="color:red;">最新分數</h3><p style="font-size:24px; font-weight:bold;">${latestScore}</p></div>
          <div><h3 style="color:blue;">最新正確率</h3><p style="font-size:24px; font-weight:bold;">${latestAccuracy}%</p></div>
          <div><h3 style="color:green;">累積答對字數</h3><p style="font-size:24px; font-weight:bold;">${totalWords}</p></div>
        `;

        // 成績單表格
        let html = '<h3>子女帳號：' + result.child + '</h3><table><tr>';
        result.records[0].forEach(col => html += '<th>' + col + '</th>');
        html += '</tr>';
        for (let i = 1; i < result.records.length; i++) {
          html += '<tr>';
          result.records[i].forEach((val, idx) => {
            if (idx === 2 || idx === 7) {
              const cssClass = val >= 80 ? 'high-score' : 'low-score';
              html += '<td class="' + cssClass + '">' + val + '</td>';
            } else {
              html += '<td>' + val + '</td>';
            }
          });
          html += '</tr>';
        }
        html += '</table>';
        document.getElementById('result').innerHTML = html;

        // 圖表資料
        const labels = result.records.slice(1).map(r => r[0]);
        const accuracy = result.records.slice(1).map(r => r[7]);
        const words = result.records.slice(1).map(r => r[14]);
        const learning = result.records.slice(1).map(r => r[15]);
        const practicing = result.records.slice(1).map(r => r[16]);
        const mastered = result.records.slice(1).map(r => r[17]);
        const attempts = result.records.slice(1).map(r => r[5]);
        const bestStreak = result.records.slice(1).map(r => r[4]);
        const level1 = result.records.slice(1).map(r => r[9]);
        const level2 = result.records.slice(1).map(r => r[10]);
        const level3 = result.records.slice(1).map(r => r[11]);
        const level4 = result.records.slice(1).map(r => r[12]);
        const level5 = result.records.slice(1).map(r => r[13]);

        // 折線圖：正確率
        new Chart(document.getElementById('accuracyChart'), { type:'line', data:{ labels, datasets:[{ label:'正確率', data:accuracy, borderColor:'blue', fill:false }] } });
        // 折線圖：答對字數
        new Chart(document.getElementById('wordsChart'), { type:'line', data:{ labels, datasets:[{ label:'答對字數', data:words, borderColor:'green', fill:false }] } });
        // 圓餅圖：狀態比例
        new Chart(document.getElementById('statusChart'), { type:'pie', data:{ labels:['學習中','練習中','核中'], datasets:[{ data:[sum(learning), sum(practicing), sum(mastered)], backgroundColor:['yellow','blue','green'] }] } });
        // 熱力圖：每日作答次數
        new Chart(document.getElementById('heatmapChart'), { type:'bar', data:{ labels, datasets:[{ label:'每日作答次數', data:attempts, backgroundColor:attempts.map(val => val>=50?'darkblue':val>=20?'blue':'lightblue') }] } });
        // 折線圖：最佳連勝
        new Chart(document.getElementById('streakChart'), { type:'line', data:{ labels, datasets:[{ label:'最佳連勝', data:bestStreak, borderColor:'orange', backgroundColor:'rgba(255,165,0,0.2)', fill:true, tension:0.3 }] } });
        // 堆疊柱狀圖：各關卡正確率
        new Chart(document.getElementById('levelsChart'), { type:'bar', data:{ labels, datasets:[
          { label:'Level1', data:level1, backgroundColor:'red' },
          { label:'Level2', data:level2, backgroundColor:'orange' },
          { label:'Level3', data:level3, backgroundColor:'yellow' },
          { label:'Level4', data:level4, backgroundColor:'green' },
          { label:'Level5', data:level5, backgroundColor:'blue' }
        ] }, options:{ responsive:true, plugins:{ title:{ display:true, text:'各關卡正確率堆疊比較' } }, scales:{ x:{ stacked:true, title:{ display:true, text:'日期' } }, y:{ stacked:true, title:{ display:true, text:'正確率 (%)' }, max:100 } } } });
      } else {
        alert('帳號或密碼錯誤');
      }
    }
  </script>
</body>
</html>
