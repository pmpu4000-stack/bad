<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拼字小特工 · Spelling Agent</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- 導航與主要介面容器（依你的專案結構而定，此處保留拼字區塊的防護架構） -->
    <main>
      <!-- 拼字作答區塊：加入雙層防護（透明防護罩 + 背景隱形輸入框） -->
      <div class="spelling-input-wrapper" style="position: relative; display: inline-block;">
        <div id="word-slots" class="word-slots"></div>
        <div id="touch-shield" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer;"></div>
        <input type="text" id="stealth-input" 
               autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
               style="position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; top: 0; left: 0;">
      </div>
    </main>
  </div>

  <!-- 進入點：主控制器 -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
