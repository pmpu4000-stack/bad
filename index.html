<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拼字小特工 · Spelling Agent</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <script>
    // 每次開啟或刷新網頁，清空 LocalStorage，強制重新登入
    localStorage.clear();
  </script>

  <!-- 登入驗證遮罩 -->
  <div id="login-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#f5f7fa; z-index:9999; display:flex; justify-content:center; align-items:center;">
    <div style="background:white; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); width:320px; text-align:center;">
      <h2>請先登入</h2>
      <p style="color:#666; font-size:14px; margin-bottom:20px;">請輸入您的帳號與密碼以使用拼字小特工</p>
      <input type="text" id="login-user" placeholder="請輸入帳號" style="width:100%; padding:10px; margin-bottom:12px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;">
      <input type="password" id="login-pass" placeholder="請輸入密碼" style="width:100%; padding:10px; margin-bottom:20px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;">
      <button id="login-btn" style="width:100%; padding:10px; background:#4f46e5; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">確認登入</button>
      <p id="login-msg" style="color:red; font-size:13px; margin-top:10px;"></p>
    </div>
  </div>

  <canvas id="fx"></canvas>

  <div class="app">
    <!-- 省略 UI 部分，保持原樣 -->
  </div>

  <script type="module">
    const scriptUrl = "https://script.google.com/macros/s/AKfycbwTqq9cHd27xd9Lk2oZqqfcsmFR8Mdmog0wCRvljOpCFQPAERSj31tqNAZqfYc7NUX_/exec";

    // 登入驗證
    document.getElementById('login-btn').addEventListener('click', async () => {
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value.trim();
      const msgEl = document.getElementById('login-msg');

      if (!user || !pass) {
        msgEl.textContent = "請輸入帳號與密碼";
        return;
      }

      msgEl.textContent = "正在驗證並讀取雲端紀錄...";

      try {
        let response = await fetch(scriptUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "login", username: user, password: pass })
        });
        let result = await response.json();

        if (result.status === "success") {
          localStorage.setItem("current_user", user);

          // 寫入雲端紀錄到 LocalStorage
          if (result.records) {
            for (let key in result.records) {
              let value = result.records[key];
              if (typeof value === "object") {
                localStorage.setItem(key, JSON.stringify(value));
              } else {
                localStorage.setItem(key, value);
              }
            }
          }

          alert(result.records ? "登入成功！已載入雲端紀錄。" : "登入成功！開啟全新學習進度。");

          // 隱藏登入視窗
          document.getElementById('login-overlay').style.display = 'none';

          // 動態載入遊戲核心模組
          await import('./src/app.js');

          // 綁定上傳按鈕事件
          const uploadBtn = document.getElementById("btn-upload") || document.querySelector(".stat.upload");
          if (uploadBtn) {
            uploadBtn.style.cursor = "pointer";
            uploadBtn.onclick = uploadLocalStorageData;
          }
        } else {
          msgEl.textContent = result.message;
        }
      } catch (err) {
        console.error(err);
        msgEl.textContent = "連線失敗，請檢查網路。";
      }
    });

    // 上傳 LocalStorage 紀錄至 Google 試算表
    async function uploadLocalStorageData() {
      const currentUser = localStorage.getItem("current_user");
      if (!currentUser) {
        alert("未偵測到登入帳號，請重新登入！");
        return;
      }

      const iconEl = document.getElementById("s-upload");
      if (iconEl) iconEl.textContent = "⏳";

      const localData = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        localData[key] = localStorage.getItem(key);
      }

      try {
        let response = await fetch(scriptUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "saveRecord", username: currentUser, records: localData })
        });
        let result = await response.json();

        if (result.status === "success") {
          alert("上傳成功！紀錄已儲存。");
        } else {
          alert("儲存失敗：" + result.message);
        }
      } catch (err) {
        console.error("上傳失敗：", err);
        alert("連線失敗，請檢查網路。");
      } finally {
        if (iconEl) iconEl.textContent = "🌱";
      }
    }
  </script>
</body>
</html>
